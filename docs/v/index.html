<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Su estudio · EndoView</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#135650;--brand-hover:#0e3f3b;--brand-soft:rgba(19,86,80,.12);--accent:#58b580;--ink:#142030;
    --text:#142030;--muted:#4B5B66;--font:Geist,system-ui,-apple-system,sans-serif;
    --glass-bg:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));--glass-border:1px solid rgba(255,255,255,.8);
    --glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(16,40,48,.06),0 18px 44px rgba(16,40,48,.10);
    --glass-blur:blur(26px) saturate(170%)}
  *{box-sizing:border-box}
  html{background:#E6EFEE}
  body{margin:0;min-height:100vh;font:400 16px/1.5 var(--font);letter-spacing:-.005em;color:var(--text);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(46% 56% at 6% 0%,rgba(19,86,80,.55),transparent 70%),radial-gradient(40% 50% at 98% 6%,rgba(70,135,205,.40),transparent 70%),
    radial-gradient(44% 54% at 52% 58%,rgba(88,181,160,.38),transparent 72%),radial-gradient(36% 44% at 90% 98%,rgba(236,186,128,.45),transparent 70%),
    radial-gradient(34% 40% at 4% 96%,rgba(19,86,80,.32),transparent 70%),#E6EFEE}
  .vidrio{background:var(--glass-bg);border:var(--glass-border);box-shadow:var(--glass-shadow);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  header{margin:12px 16px 0;padding:14px 20px;border-radius:24px;display:flex;align-items:center;gap:12px}
  header .logo{width:36px;height:36px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:0 0 auto;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(19,86,80,.3)}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px}
  main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
  .tarjeta{border-radius:24px;padding:18px 20px;margin-bottom:16px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tarjeta b{display:block;font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
  .tarjeta span{color:var(--muted);font-size:14px}
  nav{display:flex;gap:6px;padding:5px;border-radius:999px;margin-bottom:16px}
  nav button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font);cursor:pointer}
  nav button svg{flex:0 0 auto}
  nav button.on{background:#fff;color:var(--brand);box-shadow:0 4px 12px rgba(16,40,48,.10)}
  section{display:none} section.on{display:block}
  .marco{position:relative;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 18px 44px rgba(16,40,48,.18)}
  .marco.v{aspect-ratio:16/9} .marco.r{height:75vh;background:#fff}
  .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .rejilla a{position:relative;display:block;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 6px 16px rgba(16,40,48,.12)}
  .rejilla img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .rejilla b{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:12px;padding:1px 8px;border-radius:999px}
  .bajar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:48px;border-radius:999px;
    background:var(--brand);color:#fff;text-decoration:none;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(19,86,80,.25)}
  .bajar:hover{background:var(--brand-hover)}
  .nota{color:var(--muted);font-size:13px;text-align:center;margin:12px 0}
  .aviso{padding:16px 18px;border-radius:16px;background:#fdf1d6;color:#8a5a00;font-size:15px}
  .cargando{color:var(--muted);text-align:center;padding:48px 0}
  .pie{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
  .pie span{font:800 13px Montserrat,var(--font);letter-spacing:-.02em;color:var(--ink)}
  @media(min-width:620px){.rejilla{grid-template-columns:repeat(4,1fr)}}
  @media (prefers-reduced-transparency:reduce){.vidrio{background:#fff;backdrop-filter:none}}
</style>
</head>
<body>
<header class="vidrio">
  <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg></span>
  <div><h1 id="clinica">Su estudio</h1><p id="medico" hidden></p></div>
</header>
<main><div id="main"><p class="cargando">Cargando su estudio…</p></div>
<p class="pie">Hecho con <span>EndoView</span></p></main>
<script>
// Llave pública de solo lectura: limitada a Google Drive y a este sitio web.
const LLAVE = 'AIzaSyDQHvfrLYshE-D0ApkxVEcVvJjXc2SIK8w';
const API = 'https://www.googleapis.com/drive/v3/files';
const $ = id => document.getElementById(id);
const esc = t => String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ver = id => `https://drive.google.com/file/d/${id}/preview`;
const bajar = id => `https://drive.google.com/uc?export=download&id=${id}`;
const mini = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;

function aviso(texto) { $('main').innerHTML = `<div class="aviso">${texto}</div>`; }

async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function iniciar() {
  const id = new URLSearchParams(location.search).get('e') || '';
  if (!/^[\w-]{10,}$/.test(id)) return aviso('Este enlace no es válido. Revise el código QR de su reporte.');
  let carpeta, lista;
  try {
    carpeta = await api(`${API}/${id}?fields=name,description,mimeType&key=${LLAVE}`);
    lista = await api(`${API}?q=${encodeURIComponent(`'${id}' in parents and trashed = false`)}` +
                      `&fields=files(id,name)&pageSize=50&key=${LLAVE}`);
  } catch (e) {
    return aviso('Este estudio ya no está disponible: el acceso pudo haber vencido. ' +
                 'Si necesita sus archivos, comuníquese con su médico.');
  }
  let info = {};
  try { info = JSON.parse(carpeta.description || '{}'); } catch (e) {}
  if (info.app !== 'EndoView' || carpeta.mimeType !== 'application/vnd.google-apps.folder')
    return aviso('Este enlace no es válido. Revise el código QR de su reporte.');

  if (info.clinica) { $('clinica').textContent = info.clinica; document.title = info.clinica + ' · Su estudio'; }
  if (info.medico) { $('medico').textContent = info.medico + (info.especialidad ? ' · ' + info.especialidad : ''); $('medico').hidden = false; }
  if (info.vence && new Date() > new Date(info.vence))
    return aviso('El acceso a este estudio ya venció. Si necesita sus archivos, comuníquese con su médico.');

  const a = {video: null, reporte: null, fotos: []};
  for (const f of lista.files || []) {
    if (/^Video_/i.test(f.name)) a.video = f.id;
    else if (/^Reporte_/i.test(f.name)) a.reporte = f.id;
    else if (/^Foto_\d+/i.test(f.name)) a.fotos.push(f);
  }
  a.fotos.sort((x, y) => x.name < y.name ? -1 : 1);

  const ic = {
    video: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l12 7-12 7z"/></svg>',
    fotos: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
    reporte: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>'};
  let h = info.procedimiento ? `<div class="tarjeta vidrio"><span class="eyebrow">Su estudio</span><b>${esc(info.procedimiento)}</b><span>${esc(info.fecha)} · ${esc(info.codigo)}</span></div>` : '';
  h += '<nav class="vidrio">'
    + (a.video ? `<button data-s="video">${ic.video}Video</button>` : '')
    + (a.fotos.length ? `<button data-s="fotos">${ic.fotos}Fotos</button>` : '')
    + (a.reporte ? `<button data-s="reporte">${ic.reporte}Reporte</button>` : '') + '</nav>';
  if (a.video) h += `<section id="video"><div class="marco v"><iframe src="${ver(a.video)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    <a class="bajar" href="${bajar(a.video)}">Descargar video</a>
    <p class="nota">Si el video aún no se ve, espere unos minutos: Google lo está procesando.</p></section>`;
  if (a.fotos.length) h += '<section id="fotos"><div class="rejilla">'
    + a.fotos.map((f, i) => `<a href="${mini(f.id, 2400)}" target="_blank" rel="noopener"><img loading="lazy" src="${mini(f.id, 700)}" alt="Foto ${i + 1}"><b>${i + 1}</b></a>`).join('')
    + '</div><p class="nota">Toque una foto para verla en grande y guardarla.</p></section>';
  if (a.reporte) h += `<section id="reporte"><div class="marco r"><iframe src="${ver(a.reporte)}"></iframe></div>
    <a class="bajar" href="${bajar(a.reporte)}">Descargar reporte (PDF)</a></section>`;
  if (!a.video && !a.fotos.length && !a.reporte) h += '<div class="aviso">Sus archivos todavía se están subiendo. Intente de nuevo en unos minutos.</div>';
  if (info.vence_texto) h += `<p class="nota">Disponible hasta el ${esc(info.vence_texto)}. Descargue sus archivos para conservarlos.</p>`;
  if (info.telefono) h += `<p class="nota">¿Dudas? Llame al ${esc(info.telefono)}</p>`;
  $('main').innerHTML = h;

  const bs = document.querySelectorAll('nav button');
  const ir = s => { bs.forEach(b => b.classList.toggle('on', b.dataset.s === s));
                    document.querySelectorAll('section').forEach(x => x.classList.toggle('on', x.id === s)); };
  bs.forEach(b => b.onclick = () => ir(b.dataset.s));
  if (bs.length) ir(bs[0].dataset.s);
}
iniciar();
</script>
</body>
</html>
